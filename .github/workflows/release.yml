---
name: release

# Pushing a tag like v0.1.7 builds TWO portable zips and attaches both to a
# GitHub Release, together with the update notes for that version:
#   * portable         - self-contained, needs nothing but Node.js (~58 MB)
#   * requires-dotnet8 - framework dependent, ~0.5 MB, needs the .NET 8 runtime
#
# The notes come from CHANGELOG.md when it has a section for the version,
# otherwise from a summary of the commits in the tag range. Re-running for the
# same tag uploads over the existing assets ("--clobber") instead of failing.

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest

    steps:
      # Full history and tags: the release notes are built from the tag range.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version from the project file
        id: version
        shell: pwsh
        run: |
          $csproj = 'src/PiAgentDesktop/PiAgentDesktop.csproj'
          [xml]$project = Get-Content $csproj
          $group = $project.Project.PropertyGroup |
                   Where-Object { $_.Version } |
                   Select-Object -First 1
          $version = $group.Version
          if (-not $version) { throw 'No <Version> in csproj.' }
          Write-Host "version = $version"
          $out = "value=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $out -Encoding utf8

      # A release must carry its update log: fail fast (before the ~2 min build)
      # rather than publishing notes that are only a list of commit subjects.
      - name: Require a CHANGELOG section for this version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          if (-not (Test-Path 'CHANGELOG.md')) {
            throw 'CHANGELOG.md is missing; a release needs its update log.'
          }
          $text = Get-Content 'CHANGELOG.md' -Raw
          $escaped = [regex]::Escape($version)
          $pattern = "(?m)^##\s+\[?$escaped\]?"
          if ($text -notmatch $pattern) {
            throw "CHANGELOG.md has no '## $version' section."
          }
          Write-Host "CHANGELOG.md has a $version section."

      # Bundle A: self-contained - nothing to install beyond Node.js.
      - name: Publish self-contained (portable)
        run: >
          dotnet publish src/PiAgentDesktop/PiAgentDesktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:PiBundleKind=portable
          -o build/full

      # Bundle B: framework dependent - ~0.5 MB zip, needs the .NET 8 runtime.
      - name: Publish framework dependent (requires-dotnet8)
        run: >
          dotnet publish src/PiAgentDesktop/PiAgentDesktop.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:PiBundleKind=requires-dotnet8
          -o build/lite

      - name: Package both zips and write the release notes
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $tag = "v$version"
          $full = "PiAgentDesktop-$version-win-x64-portable"
          $lite = "PiAgentDesktop-$version-win-x64-requires-dotnet8"

          function New-PortableZip {
            param([string]$Source, [string]$Name)
            $stage = Join-Path 'stage' $Name
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item "$Source/*" $stage -Recurse -Force
            # XML docs are not needed at runtime.
            Get-ChildItem $stage -Recurse -File -Include *.xml |
              Remove-Item -Force
            Copy-Item README.md, LICENSE, CHANGELOG.md $stage -Force
            $zip = "$Name.zip"
            Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
            Write-Host ("{0} = {1} MB" -f $zip, `
              [math]::Round((Get-Item $zip).Length / 1MB, 1))
          }

          New-PortableZip -Source 'build/full' -Name $full
          New-PortableZip -Source 'build/lite' -Name $lite

          $fullZip = "$full.zip"
          $liteZip = "$lite.zip"
          $fullMb = [math]::Round((Get-Item $fullZip).Length / 1MB, 1)
          $liteMb = [math]::Round((Get-Item $liteZip).Length / 1MB, 1)
          $fullSha = (Get-FileHash $fullZip -Algorithm SHA256).Hash
          $liteSha = (Get-FileHash $liteZip -Algorithm SHA256).Hash

          # ---- 更新内容: CHANGELOG section, else the commit range ----
          $changes = ''
          if (Test-Path 'CHANGELOG.md') {
            $text = Get-Content 'CHANGELOG.md' -Raw
            $escaped = [regex]::Escape($version)
            $pattern = "(?ms)^##\s+\[?$escaped\]?[^\r\n]*\r?\n" +
                       ".*?(?=^##\s|\z)"
            $match = [regex]::Match($text, $pattern)
            if ($match.Success) { $changes = $match.Value.Trim() }
          }

          if (-not $changes) {
            Write-Host 'no CHANGELOG section; summarising commits'
            $previous = git describe --tags --abbrev=0 "$tag^" 2>$null
            $range = $tag
            if ($previous) { $range = "$previous..$tag" }
            $subjects = git log --pretty='- %s' -n 30 $range
            $changes = "## $version`n`n" + ($subjects -join "`n")
          }

          $runtime = 'https://dotnet.microsoft.com/download/dotnet/8.0'
          $notes = @(
            $changes
            ''
            '---'
            ''
            '## 下载哪个？'
            ''
            '两个附件功能完全相同，区别只是**有没有把 .NET 运行时打进包里**。'
            ''
            '| 附件 | 大小 | 前置要求 |'
            '| --- | --- | --- |'
            "| $fullZip | $fullMb MB | 只需 Node.js 22.19+（推荐） |"
            "| $liteZip | $liteMb MB | 另需 .NET 8 Desktop Runtime |"
            ''
            "需要 .NET 8 Desktop Runtime 时：$runtime"
            ''
            '### 使用'
            ''
            '1. 解压到任意目录（不写安装目录、不注册服务）'
            '2. 双击 PiAgentDesktop.exe'
            '3. 托盘出现图标，点击打开界面；卸载 = 删除该文件夹'
            ''
            '### 校验'
            ''
            '```text'
            "$fullSha  $fullZip"
            "$liteSha  $liteZip"
            '```'
          )
          $notesPath = 'release-notes.md'
          $notes -join "`n" | Set-Content -Path $notesPath -Encoding utf8

          $out = "full=$fullZip"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $out -Encoding utf8
          $out = "lite=$liteZip"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $out -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: portable-zips
          path: |
            ${{ steps.package.outputs.full }}
            ${{ steps.package.outputs.lite }}
          if-no-files-found: error

      # Uses the preinstalled gh CLI instead of a third-party release action.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $full = '${{ steps.package.outputs.full }}'
          $lite = '${{ steps.package.outputs.lite }}'

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag already exists; uploading assets"
            gh release upload $tag $full $lite --clobber
            gh release edit $tag --notes-file release-notes.md
          }
          else {
            gh release create $tag $full $lite `
              --title "Pi Agent Desktop $tag" `
              --notes-file release-notes.md
          }
